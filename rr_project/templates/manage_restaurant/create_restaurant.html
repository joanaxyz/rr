{% extends 'common/rr_base.html' %}

{% block title %}Create Restaurant{% endblock %}

{% block rr_base_css %}
<style>
/* ===== Create Restaurant Card ===== */
.create-restaurant-card {
    max-width: 650px;
    margin: 3rem auto;
    padding: 2.5rem;
    background: linear-gradient(135deg, #ffffff, #f9fafb);
    border-radius: 1rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.create-restaurant-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.12);
}

.create-restaurant-card h2 {
    font-size: 2rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 2rem;
    text-align: center;
}

.create-restaurant-card form p {
    margin-bottom: 1rem;
    color: #374151;
}

.create-restaurant-card form input,
.create-restaurant-card form select,
.create-restaurant-card form textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    border-radius: 0.5rem;
    border: 1px solid #d1d5db;
    background-color: #fefefe;
    font-size: 0.95rem;
    color: #111827;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.create-restaurant-card form input:focus,
.create-restaurant-card form select:focus,
.create-restaurant-card form textarea:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}

.create-restaurant-card form button {
    display: block;
    width: 100%;
    padding: 0.85rem;
    background-color: #3b82f6;
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}

.create-restaurant-card form button:hover {
    background-color: #2563eb;
    transform: translateY(-2px);
}

/* Optional: Small description under inputs */
.create-restaurant-card form small {
    display: block;
    margin-top: -0.75rem;
    margin-bottom: 1rem;
    color: #6b7280;
    font-size: 0.85rem;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .create-restaurant-card {
        padding: 2rem;
        margin: 2rem 1rem;
    }

    .create-restaurant-card h2 {
        font-size: 1.75rem;
    }
}
</style>
{% endblock %}

{% block rr_base_content %}
<div class="create-restaurant-card">
    <h2>Create a New Restaurant</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Restaurant</button>
    </form>
</div>
{% endblock %}
